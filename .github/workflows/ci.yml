name: ci

on: [push]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # No `version:` here on purpose: pnpm/action-setup reads it from the
      # `packageManager` field in package.json. Setting both makes the action
      # fail with 'Multiple versions of pnpm specified'.
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
